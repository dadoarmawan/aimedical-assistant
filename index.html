<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anamnesis Klinik (Gemini AI)</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <style>
        :root {
            --md-sys-color-primary: #006874;
            --md-sys-color-on-primary: #ffffff;
            --md-sys-color-primary-container: #97f0ff;
            --md-sys-color-on-primary-container: #001f24;
            --md-sys-color-secondary-container: #cce8e8;
            --md-sys-color-surface: #fbfdfd;
            --md-sys-color-surface-variant: #dbe4e6;
            --md-sys-color-on-surface: #191c1d;
            --border-radius: 16px;
        }

        * { box-sizing: border-box; font-family: 'Roboto', sans-serif; margin: 0; padding: 0; }
        
        body { background-color: #f4f7f8; color: var(--md-sys-color-on-surface); padding: 20px 10px; }
        
        .container { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
        
        .header { text-align: center; margin-bottom: 10px; }
        .header h1 { color: var(--md-sys-color-primary); font-size: 24px; font-weight: 700; }
        
        .card {
            background-color: var(--md-sys-color-surface);
            border-radius: var(--border-radius);
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid #e0e0e0;
        }

        .card-title {
            font-size: 18px; font-weight: 600; margin-bottom: 15px;
            display: flex; align-items: center; gap: 8px; color: var(--md-sys-color-primary);
        }

        label { font-size: 14px; font-weight: 500; color: #4a4a4a; display: block; margin-bottom: 8px; }
        
        select, input, textarea {
            width: 100%; padding: 12px 16px;
            border-radius: 12px; border: 1px solid var(--md-sys-color-surface-variant);
            background-color: var(--md-sys-color-surface); font-size: 16px;
            transition: all 0.3s;
        }
        select:focus, input:focus, textarea:focus {
            outline: none; border-color: var(--md-sys-color-primary);
            box-shadow: 0 0 0 2px var(--md-sys-color-primary-container);
        }

        .row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
        .col { flex: 1; min-width: 120px; }

        textarea { resize: vertical; min-height: 120px; line-height: 1.5; }
        textarea.small-textarea { min-height: 80px; }

        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 12px 24px; border-radius: 30px; border: none; font-size: 16px; font-weight: 500;
            cursor: pointer; transition: background 0.3s, transform 0.1s; width: 100%;
        }
        .btn:active { transform: scale(0.98); }
        .btn-primary { background-color: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); }
        .btn-primary:hover { opacity: 0.9; }
        .btn-record { background-color: #ba1a1a; color: white; margin-top: 10px; }
        .btn-record.recording { animation: pulse 1.5s infinite; }
        .btn-secondary { background-color: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-primary-container); }
        .btn-copy { padding: 6px 12px; font-size: 14px; width: auto; border-radius: 8px; }

        .btn-group-right { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }

        .result-section { display: none; flex-direction: column; gap: 20px; }
        .sekat-card { border-left: 5px solid var(--md-sys-color-primary); }

        #loadingIndicator { display: none; text-align: center; padding: 20px; font-weight: 500; color: var(--md-sys-color-primary); }
        .spinner {
            border: 4px solid var(--md-sys-color-surface-variant); border-top: 4px solid var(--md-sys-color-primary);
            border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite;
            margin: 0 auto 10px auto;
        }

        #snackbar {
            visibility: hidden; min-width: 250px; background-color: #323232; color: #fff;
            text-align: center; border-radius: 8px; padding: 16px;
            position: fixed; z-index: 1; left: 50%; bottom: 30px; transform: translateX(-50%);
        }
        #snackbar.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0% { background-color: #ba1a1a; } 50% { background-color: #ff5449; } 100% { background-color: #ba1a1a; } }
        @keyframes fadein { from { bottom: 0; opacity: 0; } to { bottom: 30px; opacity: 1; } }
        @keyframes fadeout { from { bottom: 30px; opacity: 1; } to { bottom: 0; opacity: 0; } }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Anamnesis Klinik (AI)</h1>
    </div>

    <!-- MAIN INPUT CARD -->
    <div class="card">
        <div class="card-title"><span class="material-symbols-outlined">mic</span> Input Anamnesis</div>
        
        <label>Pilih Mesin Suara (Speech-to-Text):</label>
        <select id="sttEngine" style="margin-bottom: 15px;">
            <option value="native">Native Microphone Bawaan</option>
            <option value="gemini">Gemini AI (Audio-to-Text Medis Akurat)</option>
        </select>

        <textarea id="rawAnamnesis" placeholder="Ketikan manual atau hasil rekaman suara akan muncul di sini..."></textarea>
        
        <button id="btnRecord" class="btn btn-record" onclick="toggleRecord()">
            <span class="material-symbols-outlined" id="micIcon">mic</span>
            <span id="recordText">Mulai Rekam Suara</span>
        </button>

        <hr style="border: 0; border-top: 1px solid #e0e0e0; margin: 25px 0 15px 0;">

        <div class="card-title" style="font-size: 16px;"><span class="material-symbols-outlined">person</span> Info Tambahan Pasien</div>
        <div class="row">
            <div class="col">
                <label>Usia</label>
                <input type="text" id="usia" placeholder="Mis: 35 Tahun">
            </div>
            <div class="col">
                <label>Berat (Kg)</label>
                <input type="number" id="bb" placeholder="Mis: 65">
            </div>
            <div class="col">
                <label>Gender</label>
                <select id="jk">
                    <option value="Laki-laki">Laki-laki</option>
                    <option value="Perempuan">Perempuan</option>
                </select>
            </div>
        </div>

        <button class="btn btn-primary" onclick="analisisMedis()" style="margin-top: 10px;">
            <span class="material-symbols-outlined">analytics</span> Analisis Medis
        </button>
    </div>

    <div id="loadingIndicator">
        <div class="spinner"></div>
        <div id="loadingText">Sedang menganalisis...</div>
    </div>

    <!-- RESULT SECTIONS (SEKAT) -->
    <div id="resultSection" class="result-section">
        
        <!-- Sekat 1: Anamnesis -->
        <div class="card sekat-card">
            <div class="card-title"><span class="material-symbols-outlined">edit_document</span> Anamnesis Disempurnakan</div>
            <textarea id="resAnamnesis"></textarea>
            <div class="btn-group-right">
                <button class="btn btn-secondary btn-copy" onclick="copyText('resAnamnesis')">Copy Anamnesis</button>
            </div>
        </div>

        <!-- Sekat 2: Diagnosis -->
        <div class="card sekat-card">
            <div class="card-title"><span class="material-symbols-outlined">stethoscope</span> Diagnosis Medis</div>
            <label style="font-size: 12px; color: #666;">Anda bisa mengedit / mengerucutkan diagnosis ini secara manual.</label>
            <textarea id="resDiagnosis" class="small-textarea"></textarea>
            <div class="btn-group-right">
                <button class="btn btn-secondary btn-copy" onclick="copyText('resDiagnosis')">Copy Diagnosis</button>
                <button class="btn btn-primary btn-copy" onclick="perbaruiTatalaksana()">🔄 Perbarui Tatalaksana</button>
            </div>
        </div>

        <!-- Sekat 3: Tatalaksana -->
        <div class="card sekat-card">
            <div class="card-title"><span class="material-symbols-outlined">prescriptions</span> Tatalaksana & Resep</div>
            <textarea id="resTatalaksana"></textarea>
            <div class="btn-group-right">
                <button class="btn btn-secondary btn-copy" onclick="copyText('resTatalaksana')">Copy Tatalaksana</button>
            </div>
        </div>

    </div>
</div>

<div id="snackbar">Pesan Notifikasi</div>

<script>
    // --- KONFIGURASI API KEY ---
    const API_KEY = "AQ.Ab8RN6L-rzlaU1FK8-p8KKYc62Z6vZUs67sIwJc0R2RzVJrXXg"; 
    
    // VARIABEL STATE
    let isRecording = false;
    let mediaRecorder;
    let audioChunks = [];
    
    // Setup Native STT
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'id-ID';
        recognition.continuous = true;
        recognition.interimResults = false; 
        
        recognition.onresult = (event) => {
            let result = '';
            for (let i = event.resultIndex; i < event.results.length; i++) {
                result += event.results[i][0].transcript + ' ';
            }
            const rawArea = document.getElementById('rawAnamnesis');
            rawArea.value += result;
        };
        recognition.onerror = (e) => {
            console.error(e);
            showToast("Native STT Error / Mic ditolak.");
            stopRecordingUI();
        };
    }

    // FUNGSI REKAM SUARA (DUA JALUR)
    async function toggleRecord() {
        const engine = document.getElementById('sttEngine').value;
        const btn = document.getElementById('btnRecord');

        if (!isRecording) {
            // MULAI REKAM
            document.getElementById('rawAnamnesis').value = '';
            
            if (engine === 'native') {
                if (!recognition) {
                    showToast("Browser tidak mendukung Native STT. Gunakan Chrome/Edge.");
                    return;
                }
                recognition.start();
                startRecordingUI();
            } else {
                // Jalur Gemini (MediaRecorder)
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    let mimeType = 'audio/webm';
                    if (!MediaRecorder.isTypeSupported('audio/webm')) {
                        mimeType = 'audio/mp4'; // Fallback iOS
                    }
                    
                    mediaRecorder = new MediaRecorder(stream, { mimeType: mimeType });
                    audioChunks = [];
                    
                    mediaRecorder.ondataavailable = (e) => {
                        if (e.data.size > 0) audioChunks.push(e.data);
                    };
                    
                    mediaRecorder.onstop = async () => {
                        const audioBlob = new Blob(audioChunks, { type: mimeType });
                        await processAudioGemini(audioBlob, mimeType);
                    };
                    
                    mediaRecorder.start();
                    startRecordingUI();
                } catch (err) {
                    showToast("Gagal mengakses mikrofon.");
                }
            }
        } else {
            // BERHENTI REKAM
            if (engine === 'native') {
                recognition.stop();
            } else {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
            }
            stopRecordingUI();
        }
    }

    function startRecordingUI() {
        isRecording = true;
        const btn = document.getElementById('btnRecord');
        btn.classList.add('recording');
        document.getElementById('recordText').innerText = "Berhenti Rekam";
        document.getElementById('micIcon').innerText = "stop_circle";
    }

    function stopRecordingUI() {
        isRecording = false;
        const btn = document.getElementById('btnRecord');
        btn.classList.remove('recording');
        document.getElementById('recordText').innerText = "Mulai Rekam Suara";
        document.getElementById('micIcon').innerText = "mic";
    }

    // PROSES AUDIO KE GEMINI 1.5 FLASH
    async function processAudioGemini(blob, mimeType) {
        showLoading("Mentranskripsikan audio...");
        try {
            const base64Data = await new Promise((resolve) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result.split(',')[1]);
                reader.readAsDataURL(blob);
            });

            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{
                        parts: [
                            { text: "Ubah rekaman audio medis ini menjadi teks bahasa Indonesia. JANGAN tambahkan komentar apapun, HANYA teks transkripsinya saja." },
                            { inlineData: { mimeType: mimeType, data: base64Data } }
                        ]
                    }]
                })
            });

            const data = await response.json();
            if (data.candidates && data.candidates[0].content.parts[0].text) {
                document.getElementById('rawAnamnesis').value = data.candidates[0].content.parts[0].text.trim();
                showToast("Transkripsi Selesai!");
            } else {
                showToast("Suara tidak jelas atau gagal ditranskripsi.");
            }
        } catch (error) {
            showToast("Error saat memproses audio.");
        } finally {
            hideLoading();
        }
    }

    // FUNGSI UTAMA: ANALISIS MEDIS
    async function analisisMedis() {
        const anamnesis = document.getElementById('rawAnamnesis').value.trim();
        if (!anamnesis) return showToast("Silakan isi anamnesis terlebih dahulu!");

        const usia = document.getElementById('usia').value || "-";
        const bb = document.getElementById('bb').value || "-";
        const jk = document.getElementById('jk').value || "-";

        showLoading("AI sedang menganalisis diagnosis & tatalaksana...");
        document.getElementById('resultSection').style.display = 'none';

        const promptText = `
Anda adalah asisten dokter klinis. Berikut data pasien:
Usia: ${usia}
Berat Badan: ${bb} kg
Gender: ${jk}
Anamnesis Mentah: ${anamnesis}

Tugas:
1. Rapikan anamnesis mentah menjadi bahasa rekam medis yang profesional.
2. Buat kemungkinan Diagnosis (Diagnosis Kerja / Banding).
3. Buat rencana Tatalaksana (Medikamentosa dengan dosis rasional & Edukasi).

Format balasan HARUS HANYA berupa JSON valid dengan struktur berikut:
{
  "anamnesis": "teks anamnesis rapi",
  "diagnosis": "teks diagnosis",
  "tatalaksana": "teks tatalaksana lengkap"
}
Jangan gunakan blok kode (markdown \`\`\`json). Berikan JSON murni.`;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: promptText }] }]
                })
            });

            const data = await response.json();
            let aiText = data.candidates[0].content.parts[0].text;
            
            aiText = aiText.replace(/```json/gi, '').replace(/```/g, '').trim();
            const resultJSON = JSON.parse(aiText);

            document.getElementById('resAnamnesis').value = resultJSON.anamnesis;
            document.getElementById('resDiagnosis').value = resultJSON.diagnosis;
            document.getElementById('resTatalaksana').value = resultJSON.tatalaksana;

            document.getElementById('resultSection').style.display = 'flex';
            showToast("Analisis Medis Selesai!");
            
            document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth' });
        } catch (error) {
            console.error(error);
            showToast("Gagal menganalisis. Coba lagi.");
        } finally {
            hideLoading();
        }
    }

    // FUNGSI: PERBARUI TATALAKSANA
    async function perbaruiTatalaksana() {
        const diagBaru = document.getElementById('resDiagnosis').value.trim();
        const anam = document.getElementById('resAnamnesis').value.trim();
        const usia = document.getElementById('usia').value || "-";
        const bb = document.getElementById('bb').value || "-";

        if (!diagBaru) return showToast("Diagnosis kosong.");

        showLoading("Membuat ulang tatalaksana berdasarkan diagnosis baru...");

        const promptText = `
Sebagai asisten dokter klinis, buatkan HANYA Tatalaksana (Medikamentosa dan Non-medikamentosa) yang spesifik untuk diagnosis berikut:

Diagnosis Pasti/Dikerucutkan: ${diagBaru}
Data Pasien: Usia ${usia}, BB ${bb} kg.
Konteks Anamnesis: ${anam}

Langsung berikan teks tatalaksananya saja, jangan beri kata pengantar. Pastikan dosis sesuai usia dan berat badan.`;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: promptText }] }]
                })
            });

            const data = await response.json();
            const tatalaksanaBaru = data.candidates[0].content.parts[0].text;
            
            document.getElementById('resTatalaksana').value = tatalaksanaBaru.trim();
            showToast("Tatalaksana Berhasil Diperbarui!");
        } catch (error) {
            showToast("Gagal memperbarui tatalaksana.");
        } finally {
            hideLoading();
        }
    }

    // FUNGSI UTILITIES
    function showLoading(msg) {
        document.getElementById('loadingIndicator').style.display = 'block';
        document.getElementById('loadingText').innerText = msg;
    }
    function hideLoading() {
        document.getElementById('loadingIndicator').style.display = 'none';
    }

    function showToast(message) {
        const sb = document.getElementById("snackbar");
        sb.innerText = message;
        sb.className = "show";
        setTimeout(() => { sb.className = sb.className.replace("show", ""); }, 3000);
    }

    function copyText(elementId) {
        const text = document.getElementById(elementId);
        text.select();
        text.setSelectionRange(0, 99999);
        navigator.clipboard.writeText(text.value).then(() => {
            showToast("Teks disalin ke clipboard!");
        });
    }
</script>
</body>
</html>
